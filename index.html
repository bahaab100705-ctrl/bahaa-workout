<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHAA BADER - Workout Tracker</title>

     <style>
      .tableBox{
    width:100%;
    overflow-x:auto;
}

input[type="text"]{
    width:95%;
    padding:7px;
    font-size:16px;
    text-align:center;
    box-sizing:border-box;
}

@media screen and (max-width:768px){

    header{
        font-size:20px;
        padding:10px;
    }

    h2{
        font-size:22px;
    }

    table{
        width:100%;
        min-width:unset;
    }

    th,td{
        font-size:12px;
        padding:5px;
    }

    input{
        width:50px;
        font-size:12px;
    }

    input[type="text"]{
        width:95%;
        font-size:12px;
    }

    button,a{
        font-size:16px;
        padding:10px 15px;
    }
}
    </style>
</head>

<body>

<header>💪 BAHAA BADER - Workout Tracker</header>

<h2>אימון A - חזה ויד אחורית</h2>

<div class="tableBox">
<table>
<tr>
    <th>מספר</th>
    <th>שם התרגיל</th>
    <th>משקל</th>
    <th>מספר חזרות</th>
    <th>מספר סטים</th>
</tr>

<tr><td>1</td><td><input type="text" value="חתירה עליון נגד סמיט משין"></td><td><input value="20 קג"></td><td><input value="8"></td><td><input value="3"></td></tr>
<tr><td>2</td><td><input type="text" value="לחיצת חזה בסמית משין"></td><td><input value="25 קג"></td><td><input value="8"></td><td><input value="3"></td></tr>
<tr><td>3</td><td><input type="text" value="חזה פרפר במכונה"></td><td><input value="40 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>
<tr><td>4</td><td><input type="text" value="לחיצת חזה כנגד מכונה בישיבה"></td><td><input value="45 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>
<tr><td>5</td><td><input type="text" value="פשיטת מרפקים כנגד קייבל קרוס עם מוט"></td><td><input value="7 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>
<tr><td>6</td><td><input type="text" value="פשיטת מרפקים מעל הראש עם חבל בקייבל קרוס"></td><td><input value="15 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>
<tr><td>7</td><td><input type="text" value="פשיטת מרפקים בשכיבה עם משקולות יד"></td><td><input value="5 קג"></td><td><input value="10"></td><td><input value="3"></td></tr>
</table>
</div>

<button onclick="saveData()">שמור שינויים</button>
<br>

<a href="training1.Html">דף 2</a>
<a href="training2.Html">דף 3</a>

<script>
    let pageName = "page1_";

    function saveData() {
        let inputs = document.querySelectorAll("input");

        for (let i = 0; i < inputs.length; i++) {
            localStorage.setItem(pageName + "input_" + i, inputs[i].value);
        }

        alert("השינויים נשמרו בהצלחה 💪");
    }

    window.onload = function () {
        let inputs = document.querySelectorAll("input");

        for (let i = 0; i < inputs.length; i++) {
            let savedValue = localStorage.getItem(pageName + "input_" + i);

            if (savedValue !== null) {
                inputs[i].value = savedValue;
            }
        }
    }
</script>

</body>
</html>
