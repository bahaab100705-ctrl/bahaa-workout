</head>

<body>

<header>BAHAA BADER - Workout Tracker 💪</header>


<h2>אימון C - רגליים וכתפיים</h2>

<table>
<tr>

<tr><td>2</td><td><input type ="text" placeholder="דדליפט רומני כנגד מוט"></td><td><input value="5 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>
<tr><td>3</td><td><input type ="text" placeholder="ארבע ראשי לבחירה"></td><td><input value="7 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>
<tr><td>4</td><td><input type ="text" placeholder="פשיטת ברך במכונה"></td><td><input value="49 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>
<tr><td>5</td><td><input type ="text" placeholder="כפיפת ברכיים בשכיבה במכונה"></td><td><input value="21 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>

<tr><td>7</td><td><input type ="text" placeholder="לחיצת כתפיים בישיבה עם משקולות"></td><td><input value="15 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>
<tr><td>8</td><td><input type ="text" placeholder="הרחקת כתף יד אחת בקרוס"></td><td><input value="2 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>
<tr><td>9</td><td><input type ="text" placeholder="פרפר הפוך במכונה - כתף אחורית"></td><td><input value="15 קג"></td><td><input value="12"></td><td><input value="3"></td></tr>
</table>
<button onclick="saveData()">שמור שינויים</button>
<br>

<script>
    let pageName = "page3_";

    function saveData() {
        let inputs = document.querySelectorAll("input");

        for (let i = 0; i < inputs.length; i++) {
            localStorage.setItem(pageName + "input_" + i, inputs[i].value);
        }

        alert("השינויים נשמרו בהצלחה 💪");
    }

    window.onload = function () {
        let inputs = document.querySelectorAll("input");

        for (let i = 0; i < inputs.length; i++) {
            let savedValue = localStorage.getItem(pageName + "input_" + i);

            if (savedValue !== null) {
                inputs[i].value = savedValue;
            }
        }
    }
</script>
